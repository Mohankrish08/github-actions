name: CI

# Run on every push to main, and on every pull request
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 1. Do the data cleaning and the API still work?
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ".[test]"
      - run: pytest -v

  # 2. Is the model still good enough? Runs only if the tests passed
  model-check:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .
      - run: python src/download_data.py 2019-10 2019-11
      - run: python src/check_model.py
      # Hand the model that passed to the next job
      - uses: actions/upload-artifact@v7
        with:
          name: model
          path: model/

  # 3. Does the API image build and answer? Runs only if the model passed
  docker:
    needs: model-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: model
          path: model/
      - run: docker build -t taxi-api .
      - name: Start the API and try one prediction
        run: |
          docker run -d --name api -p 8000:8000 taxi-api
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 2; done
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"PULocationID": 74, "DOLocationID": 75, "trip_distance": 2.5, "hour": 8, "weekday": 1}'
      - name: Show the API logs if something failed
        if: failure()
        run: docker logs api
